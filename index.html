<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing performance</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#37352f; --muted:#787774;
    --line:rgba(55,53,47,.09); --line-strong:rgba(55,53,47,.16);
    --chip:rgba(55,53,47,.04); --chip-on:rgba(55,53,47,.08);
    --up:#448361; --down:#c4554d;
    --s1:#337ea9; --s2:#9065b0; --s3:#cb912f;
    --radius:6px;
  }
  html[data-theme="dark"]{
    --bg:#191919; --panel:#202020; --text:#d4d4d4; --muted:#9b9b9b;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --chip:rgba(255,255,255,.055); --chip-on:rgba(255,255,255,.11);
    --up:#4dab9a; --down:#df5452;
    --s1:#529cca; --s2:#9a6dd7; --s3:#ca9849;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 32px 48px}
  @media(max-width:640px){ .wrap{padding:16px} }

  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  h1{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0}
  .sub{color:var(--muted); font-size:13px}
  .spacer{flex:1}

  .controls{display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    padding:10px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px}
  .seg{display:inline-flex; background:var(--chip); border-radius:var(--radius); padding:2px}
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; padding:4px 12px; border-radius:4px; cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--panel); color:var(--text); font-weight:500;
    box-shadow:0 1px 2px rgba(15,15,15,.12)}
  html[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--line-strong)}
  .seg button:focus-visible{outline:2px solid var(--s1); outline-offset:1px}

  .dates{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
  input[type=date]{
    font:inherit; font-size:13px; color:var(--text); background:var(--chip);
    border:1px solid transparent; border-radius:var(--radius); padding:4px 8px;
  }
  input[type=date]:hover{border-color:var(--line-strong)}
  .ghost{appearance:none; border:1px solid var(--line-strong); background:transparent;
    color:var(--muted); font:inherit; font-size:12px; padding:4px 10px; border-radius:var(--radius); cursor:pointer}
  .ghost:hover{color:var(--text)}

  .group{margin-bottom:26px}
  .group h2{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px;
  }
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  @media(max-width:720px){ .cards{grid-template-columns:1fr} }
  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--panel);
  }
  .card .label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .card .value{font-size:24px; font-weight:600; letter-spacing:-.02em; margin-top:4px;
    font-variant-numeric:tabular-nums}
  .card .delta{font-size:12px; margin-top:2px; color:var(--muted); font-variant-numeric:tabular-nums}
  .delta b{font-weight:500}
  .up{color:var(--up)} .down{color:var(--down)}
  .card .note{font-size:11px; color:var(--muted); margin-top:7px; line-height:1.4;
    padding-top:7px; border-top:1px solid var(--line)}

  .banner{border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px;
    background:var(--panel); color:var(--muted); font-size:13px; line-height:1.6}
  .banner b{color:var(--text); font-weight:600; display:block; margin-bottom:6px; font-size:15px}
  .banner code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    background:var(--chip); padding:1px 5px; border-radius:3px}
  .stale{color:var(--down)}
  input[type=date]:focus-visible, .ghost:focus-visible{outline:2px solid var(--s1); outline-offset:1px}

  .chartbox{border:1px solid var(--line); border-radius:var(--radius); padding:14px; background:var(--panel)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
    font:inherit; font-size:12px; padding:3px 10px; border-radius:20px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--chip-on); color:var(--text); border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--s1); outline-offset:1px}
  svg{display:block; width:100%; height:auto}
  .axis{fill:var(--muted); font-size:11px}
  .grid{stroke:var(--line)}
  .empty{color:var(--muted); font-size:13px; padding:40px 0; text-align:center}
  footer{margin-top:18px; font-size:12px; color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){ .bar,.pt{transition:opacity .12s} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Marketing performance</h1>
    <span class="sub" id="rangeLabel"></span>
    <span class="spacer"></span>
    <button class="ghost" id="themeBtn" type="button">Dark</button>
  </header>

  <div class="controls">
    <div class="seg" id="grainSeg" role="group" aria-label="Aggregation">
      <button type="button" data-grain="day">Daily</button>
      <button type="button" data-grain="week">Weekly</button>
      <button type="button" data-grain="month" aria-pressed="true">Monthly</button>
      <button type="button" data-grain="year">Yearly</button>
    </div>
    <div class="dates">
      <input type="date" id="from" aria-label="Start date">
      <span>to</span>
      <input type="date" id="to" aria-label="End date">
    </div>
    <div class="seg" id="presetSeg" role="group" aria-label="Quick ranges">
      <button type="button" data-preset="30">30d</button>
      <button type="button" data-preset="90">90d</button>
      <button type="button" data-preset="365">12mo</button>
      <button type="button" data-preset="all">All</button>
    </div>
  </div>

  <div class="group">
    <h2>Social &mdash; Buffer</h2>
    <div class="cards" id="cards-social"></div>
  </div>

  <div class="group">
    <h2>Website &mdash; Google Analytics</h2>
    <div class="cards" id="cards-web"></div>
  </div>

  <div class="group">
    <h2>Newsletter</h2>
    <div class="cards" id="cards-email"></div>
  </div>

  <div class="chartbox">
    <div class="chips" id="chips"></div>
    <div id="chart"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   DATA CONTRACT — one row per day, raw counts only (never rates).

   Rates are derived here, at read time, from summed counts. That is
   the whole point: averaging seven daily open rates does not give the
   weekly open rate. sum(opened)/sum(delivered) does.

   { "date":"2026-07-30",
     "views":0, "reach":0, "reactions":0, "comments":0, "shares":0,
     "reach_engagements":0,
     "sessions":0, "pageviews":0, "conversions":0,
     "followers":null, "subscribers":null,
     "emails_delivered":0, "emails_opened":0, "emails_clicked":0 }

   followers / subscribers are end-of-day snapshots (levels) and may be
   null, meaning "not known on this day" — which is NOT zero. Everything
   else is a count for that day.

   reach_engagements is engagements counted only from channels that also
   reported reach. Facebook and Bluesky return engagement but no reach,
   so dividing all-channel engagements by two-channel reach overstates
   the rate by ~24%. This field is the denominator-matched numerator.
   ============================================================ */

const COUNTS = ["views","reach","reactions","comments","shares","reach_engagements",
  "sessions","pageviews","conversions","emails_delivered","emails_opened","emails_clicked"];
const LEVELS = ["followers","subscribers"];

const METRICS = {
  views:       {label:"Views",              group:"social", kind:"sum",   fmt:"int", color:"--s1", num:"views",
                note:"Meta folded impressions, Reel plays and Story impressions into a single Views metric. LinkedIn and Facebook still report impressions; those are the same thing and are counted here."},
  engagement:  {label:"Engagement rate",    group:"social", kind:"ratio", fmt:"pct", color:"--s1", num:"reach_engagements", den:"reach",
                zero:"No reach recorded in this range",
                note:"Engagements ÷ reach, both counted only from Instagram and LinkedIn. Facebook and Bluesky report engagement but not reach, so including them would inflate this."},
  followers:   {label:"Follower growth",    group:"social", kind:"stock", fmt:"int", color:"--s1", num:"followers",
                note:"Bluesky only — Buffer exposes no follower count for Instagram, Facebook or LinkedIn. There is no historical series, so this fills in from the day tracking started."},
  reach:       {label:"Reach",              group:"social", kind:"sum",   fmt:"int", color:"--s1", num:"reach", chartOnly:true},
  engagements: {label:"Engagements",        group:"social", kind:"sum",   fmt:"int", color:"--s1", num:["reactions","comments","shares"], chartOnly:true},

  sessions:    {label:"Sessions",           group:"web",    kind:"sum",   fmt:"int", color:"--s2", num:"sessions"},
  pageviews:   {label:"Pageviews",          group:"web",    kind:"sum",   fmt:"int", color:"--s2", num:"pageviews"},
  conversion:  {label:"Conversion rate",    group:"web",    kind:"ratio", fmt:"pct", color:"--s2", num:"conversions", den:"sessions",
                zero:"No sessions in this range",
                note:"GA4 key events (the metric formerly called conversions). Reads 0% until an event is marked as a key event in GA4."},

  subscribers: {label:"Subscribers",        group:"email",  kind:"level", fmt:"int", color:"--s3", num:"subscribers",
                note:"Mailchimp reports only a current total. Its daily subs/unsubs deltas don't reconcile with it, so history starts the day tracking began rather than being reconstructed."},
  openrate:    {label:"Open rate",          group:"email",  kind:"ratio", fmt:"pct", color:"--s3", num:"emails_opened",  den:"emails_delivered",
                zero:"No sends in this range"},
  ctr:         {label:"Click-through rate", group:"email",  kind:"ratio", fmt:"pct", color:"--s3", num:"emails_clicked", den:"emails_delivered",
                zero:"No sends in this range"}
};

/* ---------- state ---------- */
let ROWS = [], grain = "month", metric = "views";
const $ = id => document.getElementById(id);
const num = v => v==null ? 0 : v;

/* Dates are UTC throughout. Parsing 'YYYY-MM-DD' as local time and then
   re-serialising via toISOString() shifts the day backwards for any viewer
   east of UTC, which silently misfiles rows into the wrong week or month. */
const parse = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0,10);
const shift = (s, days) => { const d = parse(s); d.setUTCDate(d.getUTCDate()+days); return iso(d); };

/* Sum one metric's field(s) from a bucket or row. */
const fields = m => Array.isArray(m.num) ? m.num : [m.num];
const sumOf = (o, m) => fields(m).reduce((a,f) => a + num(o[f]), 0);

/* Last known value of a level within a list of rows — nulls are gaps, not
   zeroes, so walk backwards to the most recent real reading. */
function lastLevel(rows, field){
  for (let i = rows.length-1; i >= 0; i--) if (rows[i][field] != null) return rows[i][field];
  return null;
}
/* Last known value strictly before a date, across the whole dataset. Growth
   over a range is measured against the level as it stood going in. */
function levelBefore(dateStr, field){
  for (let i = ROWS.length-1; i >= 0; i--)
    if (ROWS[i].date < dateStr && ROWS[i][field] != null) return ROWS[i][field];
  return null;
}

/* ---------- bucketing ---------- */
function bucketKey(dateStr){
  if (grain === "day")   return dateStr;
  if (grain === "year")  return dateStr.slice(0,4);
  if (grain === "month") return dateStr.slice(0,7);
  const d = parse(dateStr);                                  // ISO week: Monday start
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6) % 7));
  return iso(d);
}
function bucketLabel(key){
  if (grain === "year")  return key;
  const opts = grain === "month" ? {month:"short", year:"2-digit"} : {month:"short", day:"numeric"};
  const d = parse(grain === "month" ? key + "-01" : key);
  return d.toLocaleDateString(undefined, {...opts, timeZone:"UTC"});
}
function aggregate(rows){
  const map = new Map();
  for (const r of rows){
    const k = bucketKey(r.date);
    let b = map.get(k);
    if (!b){ b = {key:k, rows:[]}; for (const f of COUNTS) b[f] = 0; map.set(k,b); }
    b.rows.push(r);
    for (const f of COUNTS) b[f] += num(r[f]);
  }
  const list = [...map.values()].sort((a,b)=> a.key < b.key ? -1 : 1);

  /* Levels close each bucket at their last known reading and carry forward
     across empty buckets. Growth is that close minus the previous bucket's
     close — never minus zero, which is what a null would collapse to. */
  const carry = {};
  for (const f of LEVELS) carry[f] = list.length ? levelBefore(list[0].rows[0].date, f) : null;
  for (const b of list){
    b.base = {...carry};
    b.level = {};
    for (const f of LEVELS){
      const v = lastLevel(b.rows, f);
      if (v != null) carry[f] = v;
      b.level[f] = carry[f];
    }
  }
  return list;
}
function readMetric(b, key){
  const m = METRICS[key];
  if (m.kind === "ratio") return b[m.den] ? sumOf(b, m) / b[m.den] : null;
  if (m.kind === "level") return b.level[m.num];
  if (m.kind === "stock"){
    const a = b.base[m.num], z = b.level[m.num];
    return (a == null || z == null) ? null : z - a;
  }
  return sumOf(b, m);
}
/* Total across an arbitrary set of rows, using the same semantics. */
function totalMetric(rows, key){
  if (!rows.length) return null;
  const m = METRICS[key], sum = f => rows.reduce((a,r)=> a + num(r[f]), 0);
  if (m.kind === "ratio"){ const d = sum(m.den); return d ? fields(m).reduce((a,f)=>a+sum(f),0)/d : null; }
  if (m.kind === "level") return lastLevel(rows, m.num);
  if (m.kind === "stock"){
    const a = levelBefore(rows[0].date, m.num), z = lastLevel(rows, m.num);
    return (a == null || z == null) ? null : z - a;
  }
  return fields(m).reduce((a,f) => a + sum(f), 0);
}
/* Did this metric have anything to work with at all in this range? Used to
   tell "genuinely zero" apart from "nothing to measure". */
function hasBasis(rows, key){
  const m = METRICS[key];
  if (m.kind === "ratio") return rows.reduce((a,r)=> a + num(r[m.den]), 0) > 0;
  if (m.kind === "level" || m.kind === "stock") return lastLevel(rows, m.num) != null;
  return true;
}

/* ---------- formatting ---------- */
const fmtInt = n => n==null ? "—" : Math.round(n).toLocaleString();
const fmtPct = n => n==null ? "—" : (n*100).toFixed(2) + "%";
const fmtVal = (n,key) => METRICS[key].fmt === "pct" ? fmtPct(n) : fmtInt(n);

/* ---------- render ---------- */
function selectedRows(){
  const a = $("from").value, b = $("to").value;
  return ROWS.filter(r => r.date >= a && r.date <= b);
}
/* The immediately preceding period of equal length. */
function priorRows(){
  const a = $("from").value, b = $("to").value;
  const days = Math.round((parse(b) - parse(a)) / 864e5) + 1;
  const pb = shift(a, -1), pa = shift(pb, -(days-1));
  return ROWS.filter(r => r.date >= pa && r.date <= pb);
}
function deltaHTML(cur, prev, key){
  if (cur == null || prev == null) return `<span>no comparable prior period</span>`;
  const m = METRICS[key];
  if (m.fmt === "pct"){
    // Percentage-POINT change: the difference between two percentages is not
    // itself a percentage change.
    const pts = (cur - prev) * 100;
    const cls = pts >= 0 ? "up" : "down";
    return `<b class="${cls}">${pts>=0?"+":""}${pts.toFixed(2)} pts</b> vs prior period`;
  }
  if (prev === 0) return `<span>no prior-period baseline</span>`;
  const pc = ((cur - prev) / Math.abs(prev)) * 100;
  const cls = pc >= 0 ? "up" : "down";
  return `<b class="${cls}">${pc>=0?"+":""}${pc.toFixed(1)}%</b> vs prior period`;
}
function renderCards(){
  const cur = selectedRows(), prev = priorRows();
  const box = {social:$("cards-social"), web:$("cards-web"), email:$("cards-email")};
  Object.values(box).forEach(el => el.innerHTML = "");
  for (const [key,m] of Object.entries(METRICS)){
    if (m.chartOnly) continue;
    const basis = hasBasis(cur, key);
    const c = basis ? totalMetric(cur, key) : null;
    const p = hasBasis(prev, key) ? totalMetric(prev, key) : null;
    const el = document.createElement("div");
    el.className = "card";
    const sign = m.kind === "stock" && c > 0 ? "+" : "";
    el.innerHTML =
      `<div class="label"><span class="dot" style="background:var(${m.color})"></span>${m.label}</div>
       <div class="value">${sign}${fmtVal(c,key)}</div>
       <div class="delta">${basis ? deltaHTML(c,p,key) : `<span>${m.zero || "Not recorded in this range"}</span>`}</div>
       ${m.note ? `<div class="note">${m.note}</div>` : ""}`;
    box[m.group].appendChild(el);
  }
}
function renderChips(){
  const el = $("chips"); el.innerHTML = "";
  for (const [key,m] of Object.entries(METRICS)){
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = m.label;
    b.setAttribute("aria-pressed", key === metric);
    b.onclick = () => { metric = key; renderChips(); renderChart(); };
    el.appendChild(b);
  }
}
function renderChart(){
  const rows = selectedRows(), host = $("chart");
  const buckets = aggregate(rows);
  if (!buckets.length){ host.innerHTML = `<div class="empty">No data in this range. Widen the dates.</div>`; return; }
  const m = METRICS[metric];
  const vals = buckets.map(b => readMetric(b, metric));
  const shown = vals.filter(v => v != null);
  if (!shown.length){
    host.innerHTML = `<div class="empty">${m.zero || "No " + m.label.toLowerCase() + " recorded in this range."}</div>`;
    return;
  }
  const asBars = (m.kind === "sum" || m.kind === "stock");

  const W = 900, H = 320, L = 56, R = 12, T = 14, B = 34;
  const iw = W-L-R, ih = H-T-B;
  let max = Math.max(...shown, 0), min = Math.min(...shown, 0);
  if (m.kind === "level" || m.kind === "ratio"){ const pad = (max-min)*0.15 || max*0.1 || 1; min -= pad; max += pad; }
  else { max = max * 1.08 || 1; }
  if (max === min) max = min + 1;
  const y = v => T + ih - ((v-min)/(max-min))*ih;
  const n = buckets.length;
  const bw = iw/n, cx = i => L + bw*i + bw/2;

  const ticks = 4, grid = [];
  for (let i=0;i<=ticks;i++){
    const v = min + (max-min)*i/ticks, yy = y(v);
    grid.push(`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>
      <text class="axis" x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end">${
        m.fmt==="pct" ? (v*100).toFixed(1)+"%" : shortNum(v)}</text>`);
  }
  const step = Math.ceil(n/12), xlabels = buckets.map((b,i)=>
    i % step ? "" : `<text class="axis" x="${cx(i).toFixed(1)}" y="${H-12}" text-anchor="middle">${bucketLabel(b.key)}</text>`).join("");

  let series = "";
  if (asBars){
    series = buckets.map((b,i)=>{
      const v = vals[i]; if (v==null) return "";
      const top = Math.min(y(v), y(0)), h = Math.abs(y(v)-y(0));
      return `<rect class="bar" x="${(cx(i)-bw*0.32).toFixed(1)}" y="${top.toFixed(1)}" width="${(bw*0.64).toFixed(1)}"
        height="${Math.max(h,1).toFixed(1)}" rx="2" fill="var(${m.color})" opacity=".85">
        <title>${bucketLabel(b.key)} · ${fmtVal(v,metric)}</title></rect>`;
    }).join("");
  } else {
    // Break the line at gaps instead of interpolating across them — a
    // straight run between two known points would invent readings that
    // were never taken.
    let d = "", pen = false;
    buckets.forEach((b,i) => {
      if (vals[i] == null){ pen = false; return; }
      d += `${pen ? "L" : "M"}${cx(i).toFixed(1)} ${y(vals[i]).toFixed(1)} `;
      pen = true;
    });
    series = `<path d="${d.trim()}" fill="none" stroke="var(${m.color})" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>` +
      buckets.map((b,i)=> vals[i]==null ? "" :
        `<circle class="pt" cx="${cx(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="${n>60?1.6:3}"
          fill="var(${m.color})"><title>${bucketLabel(b.key)} · ${fmtVal(vals[i],metric)}</title></circle>`).join("");
  }

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${m.label} by ${grain}">${grid.join("")}${series}${xlabels}</svg>`;
}
function shortNum(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(1)+"M";
  if (a >= 1e3) return (v/1e3).toFixed(1)+"k";
  return Math.round(v).toLocaleString();
}
function renderAll(){
  $("rangeLabel").textContent = `${$("from").value} → ${$("to").value} · ${
    {day:"daily",week:"weekly",month:"monthly",year:"yearly"}[grain]}`;
  renderCards(); renderChart();
}

/* ---------- controls ---------- */
$("grainSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  grain = b.dataset.grain;
  [...$("grainSeg").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  renderAll();
});
$("presetSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  [...$("presetSeg").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  const last = ROWS[ROWS.length-1].date;
  if (b.dataset.preset === "all"){ $("from").value = ROWS[0].date; }
  else {
    const start = shift(last, -(+b.dataset.preset - 1));
    $("from").value = start < ROWS[0].date ? ROWS[0].date : start;
  }
  $("to").value = last;
  renderAll();
});
["from","to"].forEach(id => $(id).addEventListener("change", () => {
  [...$("presetSeg").children].forEach(x => x.setAttribute("aria-pressed","false"));
  renderAll();
}));
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  $("themeBtn").textContent = dark ? "Dark" : "Light";
  renderChart();
});

/* ---------- boot ---------- */
function showMessage(title, body){
  document.querySelector(".controls").hidden = true;
  for (const id of ["cards-social","cards-web","cards-email"]) $(id).closest(".group").hidden = true;
  document.querySelector(".chartbox").innerHTML =
    `<div class="banner"><b>${title}</b>${body}</div>`;
  $("foot").textContent = "";
}

(async function init(){
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
  $("themeBtn").textContent = prefersDark ? "Light" : "Dark";

  let live = null, failed = null;
  try {
    const r = await fetch("./data.json", {cache:"no-store"});
    if (r.ok) live = await r.json(); else failed = `The server returned ${r.status}.`;
  } catch (e){ failed = "The file could not be loaded."; }

  if (!Array.isArray(live) || !live.length){
    showMessage("No data yet",
      `<code>data.json</code> is missing, empty, or not an array. ${failed || ""}
       The nightly job writes it — check the Actions tab for a failed run, or trigger
       <em>Refresh dashboard data</em> manually.`);
    return;
  }

  ROWS = live.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  const last = ROWS[ROWS.length-1].date;

  $("from").min = $("to").min = ROWS[0].date;
  $("from").max = $("to").max = last;
  $("to").value = last;
  const start = shift(last, -364);
  $("from").value = start < ROWS[0].date ? ROWS[0].date : start;

  // Flag stale data rather than presenting it as current. The job drifts by
  // design, so allow two days before saying anything.
  const behind = Math.round((Date.now() - parse(last)) / 864e5);
  $("foot").innerHTML = `${ROWS.length.toLocaleString()} days · ${ROWS[0].date} to ${last}` +
    (behind > 2 ? ` · <span class="stale">last refresh was ${behind} days ago</span>` : "");

  renderChips(); renderAll();
})();
</script>
</body>
