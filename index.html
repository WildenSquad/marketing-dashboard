<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing performance</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#37352f; --muted:#787774;
    --line:rgba(55,53,47,.09); --line-strong:rgba(55,53,47,.16);
    --chip:rgba(55,53,47,.04); --chip-on:rgba(55,53,47,.08);
    --up:#448361; --down:#c4554d;
    --s1:#337ea9; --s2:#9065b0; --s3:#cb912f;
    --radius:6px;
  }
  html[data-theme="dark"]{
    --bg:#191919; --panel:#202020; --text:#d4d4d4; --muted:#9b9b9b;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --chip:rgba(255,255,255,.055); --chip-on:rgba(255,255,255,.11);
    --up:#4dab9a; --down:#df5452;
    --s1:#529cca; --s2:#9a6dd7; --s3:#ca9849;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 32px 48px}
  @media(max-width:640px){ .wrap{padding:16px} }

  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  h1{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0}
  .sub{color:var(--muted); font-size:13px}
  .spacer{flex:1}

  .controls{display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    padding:10px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px}
  .seg{display:inline-flex; background:var(--chip); border-radius:var(--radius); padding:2px}
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; padding:4px 12px; border-radius:4px; cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--panel); color:var(--text); font-weight:500;
    box-shadow:0 1px 2px rgba(15,15,15,.12)}
  html[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--line-strong)}
  .seg button:focus-visible{outline:2px solid var(--s1); outline-offset:1px}

  .dates{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
  input[type=date]{
    font:inherit; font-size:13px; color:var(--text); background:var(--chip);
    border:1px solid transparent; border-radius:var(--radius); padding:4px 8px;
  }
  input[type=date]:hover{border-color:var(--line-strong)}
  .ghost{appearance:none; border:1px solid var(--line-strong); background:transparent;
    color:var(--muted); font:inherit; font-size:12px; padding:4px 10px; border-radius:var(--radius); cursor:pointer}
  .ghost:hover{color:var(--text)}

  .group{margin-bottom:26px}
  .group h2{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px;
  }
  .grouphead{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px}
  .grouphead h2{margin:0}
  .grouphead .seg button{font-size:12px; padding:3px 10px}
  @media(max-width:640px){ .grouphead .seg{width:100%; overflow-x:auto} }
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  @media(max-width:720px){ .cards{grid-template-columns:1fr} }
  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--panel);
  }
  .card .label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .card .value{font-size:24px; font-weight:600; letter-spacing:-.02em; margin-top:4px;
    font-variant-numeric:tabular-nums}
  .card .value.na{font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0}
  .ann{stroke:var(--muted); stroke-dasharray:3 3; opacity:.6}
  .annlabel{fill:var(--muted); font-size:10px}
  .card .delta{font-size:12px; margin-top:2px; color:var(--muted); font-variant-numeric:tabular-nums}
  .delta b{font-weight:500}
  .up{color:var(--up)} .down{color:var(--down)}
  .card .note{font-size:11px; color:var(--muted); margin-top:7px; line-height:1.4;
    padding-top:7px; border-top:1px solid var(--line)}

  .banner{border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px;
    background:var(--panel); color:var(--muted); font-size:13px; line-height:1.6}
  .banner b{color:var(--text); font-weight:600; display:block; margin-bottom:6px; font-size:15px}
  .banner code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    background:var(--chip); padding:1px 5px; border-radius:3px}
  .stale{color:var(--down)}
  input[type=date]:focus-visible, .ghost:focus-visible{outline:2px solid var(--s1); outline-offset:1px}

  .chartbox{border:1px solid var(--line); border-radius:var(--radius); padding:14px; background:var(--panel)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
    font:inherit; font-size:12px; padding:3px 10px; border-radius:20px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--chip-on); color:var(--text); border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--s1); outline-offset:1px}
  svg{display:block; width:100%; height:auto}
  .axis{fill:var(--muted); font-size:11px}
  .grid{stroke:var(--line)}
  .empty{color:var(--muted); font-size:13px; padding:40px 0; text-align:center}
  footer{margin-top:18px; font-size:12px; color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){ .bar,.pt{transition:opacity .12s} }

  /* headline strip — the four numbers an executive should read first */
  .headline{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px}
  @media(max-width:720px){ .headline{grid-template-columns:repeat(2,1fr)} }
  .hcard{border:1px solid var(--line-strong); border-radius:var(--radius); padding:14px 16px; background:var(--panel)}
  .hcard .label{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .hcard .value{font-size:30px; font-weight:600; letter-spacing:-.025em; margin-top:6px;
    font-variant-numeric:tabular-nums; line-height:1.1}
  .hcard .delta{font-size:12px; margin-top:3px; color:var(--muted); font-variant-numeric:tabular-nums}

  .coverage{font-size:11.5px; color:var(--muted); margin:0 0 22px; line-height:1.6}
  .coverage b{font-weight:500; color:var(--text)}

  /* per-source warning banner, e.g. the analytics gap */
  .flag{border:1px solid var(--line-strong); border-left:3px solid var(--down);
    border-radius:var(--radius); padding:9px 12px; margin-bottom:10px;
    font-size:12px; color:var(--muted); line-height:1.5; background:var(--panel)}
  .flag b{color:var(--text); font-weight:600}
  .softflag{border-left-color:var(--line-strong)}

  /* channel comparison — the cross-channel view, always visible */
  .tablewrap{overflow-x:auto; margin-top:12px; border:1px solid var(--line); border-radius:var(--radius)}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px}
  th,td{text-align:right; padding:8px 12px; white-space:nowrap;
    border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
  th{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); background:var(--chip)}
  th:first-child,td:first-child{text-align:left; font-variant-numeric:normal}
  tbody tr:last-child td{border-bottom:0}
  tfoot td{font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0}
  td.dim{color:var(--muted)}
  .tnote{font-size:11px; color:var(--muted); margin:6px 2px 0; line-height:1.5}

  .legend{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5}
  .method{margin-top:26px; border-top:1px solid var(--line); padding-top:12px}
  .method summary{font-size:12px; color:var(--muted); cursor:pointer}
  .method summary:focus-visible{outline:2px solid var(--s1); outline-offset:2px}
  .method dl{margin:12px 0 0; font-size:12px; color:var(--muted); line-height:1.6}
  .method dt{font-weight:600; color:var(--text); margin-top:10px}
  .method dd{margin:2px 0 0}

  /* Board packs get printed. Drop the controls, force ink-on-paper colours,
     and keep cards from splitting across pages. */
  @media print{
    .controls,.seg,#themeBtn,.chips{display:none !important}
    .method[open] summary{display:none}
    .method{border-top:1px solid #ccc}
    :root{--bg:#fff; --panel:#fff; --text:#000; --muted:#444;
      --line:#ddd; --line-strong:#bbb; --chip:#f4f4f4}
    body{font-size:11pt}
    .wrap{max-width:none; padding:0}
    .card,.hcard,.group,.chartbox,table{break-inside:avoid}
    .group{margin-bottom:18px}
    a[href]:after{content:""}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Marketing performance</h1>
    <span class="sub" id="rangeLabel"></span>
    <span class="spacer"></span>
    <button class="ghost" id="themeBtn" type="button">Dark</button>
  </header>

  <div class="controls">
    <div class="seg" id="grainSeg" role="group" aria-label="Aggregation">
      <button type="button" data-grain="day">Daily</button>
      <button type="button" data-grain="week">Weekly</button>
      <button type="button" data-grain="month" aria-pressed="true">Monthly</button>
      <button type="button" data-grain="year">Yearly</button>
    </div>
    <div class="dates">
      <input type="date" id="from" aria-label="Start date">
      <span>to</span>
      <input type="date" id="to" aria-label="End date">
    </div>
    <div class="seg" id="presetSeg" role="group" aria-label="Quick ranges">
      <button type="button" data-preset="30">30d</button>
      <button type="button" data-preset="90">90d</button>
      <button type="button" data-preset="365">12mo</button>
      <button type="button" data-preset="all">All</button>
    </div>
  </div>

  <div class="headline" id="headline"></div>

  <p class="coverage" id="coverage"></p>

  <div class="group">
    <div class="grouphead">
      <h2>Social &mdash; Buffer</h2>
      <div class="seg" id="channelSeg" role="group" aria-label="Filter social stats by channel">
        <button type="button" data-channel="all" aria-pressed="true">All</button>
        <button type="button" data-channel="instagram">Instagram</button>
        <button type="button" data-channel="facebook">Facebook</button>
        <button type="button" data-channel="linkedin">LinkedIn</button>
        <button type="button" data-channel="bluesky">Bluesky</button>
      </div>
    </div>
    <div class="cards" id="cards-social"></div>
    <div id="channelTable"></div>
  </div>

  <div class="group">
    <h2>Website &mdash; Google Analytics</h2>
    <div id="note-web"></div>
    <div class="cards" id="cards-web"></div>
  </div>

  <div class="group">
    <h2>Newsletter</h2>
    <div id="note-email"></div>
    <div class="cards" id="cards-email"></div>
  </div>

  <div class="chartbox">
    <div class="chips" id="chips"></div>
    <div id="chart"></div>
    <div class="legend" id="chartNotes"></div>
  </div>

  <details class="method" id="method">
    <summary>How these numbers are calculated</summary>
    <div id="methodBody"></div>
  </details>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   DATA CONTRACT — one row per day, raw counts only (never rates).

   Rates are derived here, at read time, from summed counts. That is
   the whole point: averaging seven daily open rates does not give the
   weekly open rate. sum(opened)/sum(delivered) does.

   { "date":"2026-07-30",
     "views":0, "reach":0, "reactions":0, "comments":0, "shares":0,
     "reach_engagements":0,
     "sessions":0, "pageviews":0, "conversions":0,
     "followers":null, "subscribers":null,
     "emails_delivered":0, "emails_opened":0, "emails_clicked":0 }

   followers / subscribers are end-of-day snapshots (levels) and may be
   null, meaning "not known on this day" — which is NOT zero. Everything
   else is a count for that day.

   reach_engagements is engagements counted only from channels that also
   reported reach. Facebook and Bluesky return engagement but no reach,
   so dividing all-channel engagements by two-channel reach overstates
   the rate by ~24%. This field is the denominator-matched numerator.

   Rows also carry by_channel — the same six Buffer counts split per
   network — which drives the channel filter:

     "by_channel": { "instagram": {"views":0,"reach":0,...}, "facebook": {...} }

   The top-level Buffer totals are summed FROM by_channel at fetch time,
   so a filtered view and the unfiltered view always reconcile.
   ============================================================ */

const COUNTS = ["views","reach","reactions","comments","shares","reach_engagements",
  "sessions","pageviews","conversions","emails_delivered","emails_opened","emails_clicked"];
const LEVELS = ["followers_bluesky","followers_instagram","followers_facebook","subscribers"];

const METRICS = {
  views:       {label:"Views",              group:"social", kind:"sum",   fmt:"int", color:"--s1", num:"views",
                note:"Meta folded impressions, Reel plays and Story impressions into a single Views metric. LinkedIn and Facebook still report impressions; those are the same thing and are counted here."},
  engagement:  {label:"Engagement rate",    group:"social", kind:"ratio", fmt:"pct", color:"--s1", num:"reach_engagements", den:"reach",
                zero:"No reach recorded in this range",
                note:"Engagements ÷ reach, both counted only from Instagram and LinkedIn. Facebook and Bluesky report engagement but not reach, so including them would inflate this."},
  /* Headline is the follower count as it stood at the end of the range;
     growth over that range is the indicator beneath it. */
  followers:   {label:"Followers",          group:"social", kind:"level", fmt:"int", color:"--s1",
                num:["followers_bluesky","followers_instagram","followers_facebook"],
                growth:true,
                zero:"Not yet recorded for this channel",
                note:"Bluesky, Instagram and Facebook. LinkedIn is excluded — its follower count needs Marketing Developer Platform approval. Networks are summed only where both ends of the range are known, so connecting a network later doesn't register as a spike in growth."},
  reach:       {label:"Reach (non-unique)", group:"social", kind:"sum",   fmt:"int", color:"--s1", num:"reach", chartOnly:true,
                note:"The sum of per-post reach, not a count of distinct people. Someone who saw twelve posts is counted twelve times, so this is always far larger than the audience. It is the correct denominator for engagement rate, but it is not an audience size."},
  followergrowth:{label:"Follower growth",  group:"social", kind:"stock", fmt:"int", color:"--s1",
                num:["followers_bluesky","followers_instagram","followers_facebook"], chartOnly:true},
  posts:       {label:"Posts published",    group:"social", kind:"sum",   fmt:"int", color:"--s1", num:"posts", chartOnly:true,
                note:"Posts sent through Buffer. The only volume figure every channel reports, which is what makes engagements per post comparable across all four."},
  engperpost:  {label:"Engagements per post", group:"social", kind:"ratio", fmt:"num2", color:"--s1",
                num:["reactions","comments","shares"], den:"posts", chartOnly:true,
                zero:"No posts in this range",
                note:"Reactions + comments + shares ÷ posts published. Unlike engagement rate, this works on every channel — reach exists on only two of the four, and views on three."},
  engagements: {label:"Engagements",        group:"social", kind:"sum",   fmt:"int", color:"--s1", num:["reactions","comments","shares"], chartOnly:true},

  sessions:    {label:"Sessions",           group:"web",    kind:"sum",   fmt:"int", color:"--s2", num:"sessions"},
  pageviews:   {label:"Pageviews",          group:"web",    kind:"sum",   fmt:"int", color:"--s2", num:"pageviews"},
  conversion:  {label:"Conversion rate",    group:"web",    kind:"ratio", fmt:"pct", color:"--s2", num:"conversions", den:"sessions",
                zero:"No sessions in this range",
                na:"No GA4 key event is defined, so there is nothing to count. Mark one in GA4 Admin → Events.",
                note:"GA4 key events ÷ sessions. GA4 has no metric called 'conversions' any more — it was renamed to key events. Nothing on this property is marked as a key event yet, so there is nothing to count."},

  subscribers: {label:"Subscribers",        group:"email",  kind:"level", fmt:"int", color:"--s3", num:"subscribers",
                note:"Mailchimp reports only a current total. Its daily subs/unsubs deltas don't reconcile with it — they sum to +829 against a member count of 272 — so history starts the day tracking began rather than being reconstructed from figures that don't add up."},
  openrate:    {label:"Open rate",          group:"email",  kind:"ratio", fmt:"pct", color:"--s3", num:"emails_opened",  den:"emails_delivered",
                zero:"No sends in this range", benchmark:0.29, benchmarkLabel:"nonprofit average ~29%",
                note:"Opens ÷ delivered, where delivered nets out hard and soft bounces. Treat this as directional only: Apple Mail Privacy Protection pre-loads tracking pixels, registering an open whether or not anyone read the message. Industry-wide open rates are inflated for the same reason, so the comparison is at least like-for-like — but the click rate below is the number to trust."},
  ctr:         {label:"Click-through rate", group:"email",  kind:"ratio", fmt:"pct", color:"--s3", num:"emails_clicked", den:"emails_delivered",
                zero:"No sends in this range", benchmark:0.034, benchmarkLabel:"nonprofit average ~3.4%",
                note:"Clicks ÷ delivered. Unaffected by Apple's pixel pre-loading, so this is the reliable measure of whether the newsletter is landing."}
};

/* ---------- state ---------- */
/* RAW is the file as loaded; ROWS is the view after the channel filter.
   Everything downstream reads ROWS, so filtering is a single projection
   rather than a condition threaded through every calculation. */
let RAW = [], ROWS = [], grain = "month", metric = "views", channel = "all";
let ANNOTATIONS = [];
/* Whether this GA4 property records key events at all. If it never has, the
   conversion rate is unmeasurable rather than zero. */
let KEY_EVENTS = false;
/* First day of an ongoing analytics blackout, or null. Zeros inside it are
   absent measurement, not observed traffic. */
let WEB_GAP = null;

/* Returns {value, note} when a metric cannot be measured at all, as opposed
   to measuring zero. Reporting "0" or "−100%" for something nobody counted
   is the difference between a quiet quarter and a broken tag. */
function unavailable(key){
  const m = METRICS[key];
  if (key === "conversion" && !KEY_EVENTS) return {value:"Not configured", note:m.na};
  if (m.group === "web" && WEB_GAP && $("from").value >= WEB_GAP)
    return {value:"—", note:`No analytics recorded from ${WEB_GAP} onward — see the note above.`};
  return null;
}

/* Buffer's per-channel counts, and which follower level belongs to which
   channel. LinkedIn has none — its follower count needs Marketing Developer
   Platform approval, so filtering to LinkedIn correctly shows no level. */
const CHANNEL_COUNTS = ["views","reach","reactions","comments","shares","reach_engagements"];
const CHANNEL_FOLLOWERS = {
  instagram:"followers_instagram", facebook:"followers_facebook",
  bluesky:"followers_bluesky", linkedin:null,
};
const $ = id => document.getElementById(id);
const num = v => v==null ? 0 : v;

/* Dates are UTC throughout. Parsing 'YYYY-MM-DD' as local time and then
   re-serialising via toISOString() shifts the day backwards for any viewer
   east of UTC, which silently misfiles rows into the wrong week or month. */
const parse = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0,10);
const shift = (s, days) => { const d = parse(s); d.setUTCDate(d.getUTCDate()+days); return iso(d); };

/* Sum one metric's field(s) from a bucket or row. */
const fields = m => Array.isArray(m.num) ? m.num : [m.num];
const sumOf = (o, m) => fields(m).reduce((a,f) => a + num(o[f]), 0);

/* Rebuild ROWS for the selected channel. Website and newsletter fields are
   copied untouched — the filter is scoped to social, as its placement in
   that section implies. */
function project(){
  if (channel === "all"){ ROWS = RAW; return; }
  const keep = CHANNEL_FOLLOWERS[channel];
  ROWS = RAW.map(r => {
    const c = r.by_channel?.[channel];
    const o = {...r};
    for (const f of CHANNEL_COUNTS) o[f] = c?.[f] ?? 0;
    for (const f of ["followers_bluesky","followers_instagram","followers_facebook"])
      if (f !== keep) o[f] = null;
    return o;
  });
}

/* Last known value of a level within a list of rows — nulls are gaps, not
   zeroes, so walk backwards to the most recent real reading. */
function lastLevel(rows, field){
  for (let i = rows.length-1; i >= 0; i--) if (rows[i][field] != null) return rows[i][field];
  return null;
}
/* Last known value strictly before a date, across the whole dataset. Growth
   over a range is measured against the level as it stood going in. */
function levelBefore(dateStr, field){
  for (let i = ROWS.length-1; i >= 0; i--)
    if (ROWS[i].date < dateStr && ROWS[i][field] != null) return ROWS[i][field];
  return null;
}

/* ---------- bucketing ---------- */
function bucketKey(dateStr){
  if (grain === "day")   return dateStr;
  if (grain === "year")  return dateStr.slice(0,4);
  if (grain === "month") return dateStr.slice(0,7);
  const d = parse(dateStr);                                  // ISO week: Monday start
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6) % 7));
  return iso(d);
}
function bucketLabel(key){
  if (grain === "year")  return key;
  const opts = grain === "month" ? {month:"short", year:"2-digit"} : {month:"short", day:"numeric"};
  const d = parse(grain === "month" ? key + "-01" : key);
  return d.toLocaleDateString(undefined, {...opts, timeZone:"UTC"});
}
function aggregate(rows){
  const map = new Map();
  for (const r of rows){
    const k = bucketKey(r.date);
    let b = map.get(k);
    if (!b){ b = {key:k, rows:[]}; for (const f of COUNTS) b[f] = 0; map.set(k,b); }
    b.rows.push(r);
    for (const f of COUNTS) b[f] += num(r[f]);
  }
  const list = [...map.values()].sort((a,b)=> a.key < b.key ? -1 : 1);

  /* Levels close each bucket at their last known reading and carry forward
     across empty buckets. Growth is that close minus the previous bucket's
     close — never minus zero, which is what a null would collapse to. */
  const carry = {};
  for (const f of LEVELS) carry[f] = list.length ? levelBefore(list[0].rows[0].date, f) : null;
  for (const b of list){
    b.base = {...carry};
    b.level = {};
    for (const f of LEVELS){
      const v = lastLevel(b.rows, f);
      if (v != null) carry[f] = v;
      b.level[f] = carry[f];
    }
  }
  return list;
}
/* Sum a level across networks, skipping the ones with no reading. Returns
   null only when nothing at all is known — a network we don't track yet must
   not read as zero followers. */
function sumLevels(pick, m){
  let total = null;
  for (const f of fields(m)){
    const v = pick(f);
    if (v != null) total = (total ?? 0) + v;
  }
  return total;
}
/* Growth, summed per network and only where BOTH ends are known. Otherwise
   connecting Instagram mid-range would book its entire 1,295 followers as
   one day's growth. */
function sumGrowth(base, level, m){
  let total = null;
  for (const f of fields(m)){
    const a = base(f), z = level(f);
    if (a != null && z != null) total = (total ?? 0) + (z - a);
  }
  return total;
}
function readMetric(b, key){
  const m = METRICS[key];
  if (m.kind === "ratio") return b[m.den] ? sumOf(b, m) / b[m.den] : null;
  if (m.kind === "level") return sumLevels(f => b.level[f], m);
  if (m.kind === "stock") return sumGrowth(f => b.base[f], f => b.level[f], m);
  return sumOf(b, m);
}
/* Total across an arbitrary set of rows, using the same semantics. */
function totalMetric(rows, key){
  if (!rows.length) return null;
  const m = METRICS[key], sum = f => rows.reduce((a,r)=> a + num(r[f]), 0);
  if (m.kind === "ratio"){ const d = sum(m.den); return d ? fields(m).reduce((a,f)=>a+sum(f),0)/d : null; }
  if (m.kind === "level") return sumLevels(f => lastLevel(rows, f), m);
  if (m.kind === "stock")
    return sumGrowth(f => levelBefore(rows[0].date, f), f => lastLevel(rows, f), m);
  return fields(m).reduce((a,f) => a + sum(f), 0);
}
/* Did this metric have anything to work with at all in this range? Used to
   tell "genuinely zero" apart from "nothing to measure". */
function hasBasis(rows, key){
  const m = METRICS[key];
  if (m.kind === "ratio") return rows.reduce((a,r)=> a + num(r[m.den]), 0) > 0;
  if (m.kind === "level") return fields(m).some(f => lastLevel(rows, f) != null);
  if (m.kind === "stock")
    return fields(m).some(f => lastLevel(rows, f) != null && levelBefore(rows[0].date, f) != null);
  return true;
}

/* ---------- formatting ---------- */
const fmtInt = n => n==null ? "—" : Math.round(n).toLocaleString();
const fmtPct = n => n==null ? "—" : (n*100).toFixed(2) + "%";
const fmtNum2 = n => n==null ? "—" : n.toFixed(2);
const fmtVal = (n,key) => {
  const f = METRICS[key].fmt;
  return f === "pct" ? fmtPct(n) : f === "num2" ? fmtNum2(n) : fmtInt(n);
};

/* ---------- render ---------- */
function selectedRows(){
  const a = $("from").value, b = $("to").value;
  return ROWS.filter(r => r.date >= a && r.date <= b);
}
/* The immediately preceding period of equal length — but only if the data
   actually covers it. Comparing a full year against the three weeks of
   history that precede it produced "+12,736%", which is arithmetic rather
   than information. A partial baseline is worse than none, so refuse it. */
function priorRows(){
  const a = $("from").value, b = $("to").value;
  const days = Math.round((parse(b) - parse(a)) / 864e5) + 1;
  const pb = shift(a, -1), pa = shift(pb, -(days-1));
  if (!RAW.length || pa < RAW[0].date) return [];
  return ROWS.filter(r => r.date >= pa && r.date <= pb);
}
function deltaHTML(cur, prev, key){
  if (cur == null || prev == null) return `<span>no comparable prior period</span>`;
  const m = METRICS[key];
  if (m.fmt === "pct"){
    // Percentage-POINT change: the difference between two percentages is not
    // itself a percentage change.
    const pts = (cur - prev) * 100;
    const cls = pts >= 0 ? "up" : "down";
    return `<b class="${cls}">${pts>=0?"+":""}${pts.toFixed(2)} pts</b> vs prior period`;
  }
  if (prev === 0) return `<span>no prior-period baseline</span>`;
  const pc = ((cur - prev) / Math.abs(prev)) * 100;
  const cls = pc >= 0 ? "up" : "down";
  return `<b class="${cls}">${pc>=0?"+":""}${pc.toFixed(1)}%</b> vs prior period`;
}
/* Movement in the level across the selected range, for cards whose headline
   is the level itself. Summed per network and only where both ends are
   known — same rule as the stock metrics. */
function growthHTML(rows, key){
  if (!rows.length) return `<span>no readings in this range</span>`;
  const m = METRICS[key];
  const g = sumGrowth(f => levelBefore(rows[0].date, f), f => lastLevel(rows, f), m);
  if (g == null) return `<span>no earlier reading to compare against</span>`;
  const cls = g >= 0 ? "up" : "down";
  return `<b class="${cls}">${g >= 0 ? "+" : "−"}${fmtInt(Math.abs(g))}</b> over this range`;
}
function renderCards(){
  const cur = selectedRows(), prev = priorRows();
  const box = {social:$("cards-social"), web:$("cards-web"), email:$("cards-email")};
  Object.values(box).forEach(el => el.innerHTML = "");
  for (const [key,m] of Object.entries(METRICS)){
    if (m.chartOnly) continue;
    const basis = hasBasis(cur, key);
    const c = basis ? totalMetric(cur, key) : null;
    const p = hasBasis(prev, key) ? totalMetric(prev, key) : null;
    const el = document.createElement("div");
    el.className = "card";
    const sign = m.kind === "stock" && c > 0 ? "+" : "";

    /* Some metrics aren't zero — they're unmeasurable. Saying "0.00%" when
       nothing is configured to be counted reads as failure rather than as
       an absent setting. */
    const na = unavailable(key);
    const indicator =
      na ? `<span>${na.note}</span>` :
      !basis ? `<span>${m.zero || "Not recorded in this range"}</span>` :
      m.growth ? growthHTML(cur, key) :
      deltaHTML(c, p, key);

    const bench = (!na && basis && c != null && m.benchmark != null)
      ? `<div class="note">${c >= m.benchmark ? "▲ above" : "▼ below"} ${m.benchmarkLabel}</div>`
      : "";

    el.innerHTML =
      `<div class="label"><span class="dot" style="background:var(${m.color})"></span>${m.label}</div>
       <div class="value${na ? " na" : ""}">${na ? na.value : sign + fmtVal(c,key)}</div>
       <div class="delta">${indicator}</div>${bench}`;
    box[m.group].appendChild(el);
  }
}

/* ---------- the executive view ---------- */

/* Four numbers above everything else. Sessions is included even while GA4 is
   dark, because its absence is itself the story this quarter. */
const HEADLINE = ["views", "engagements", "subscribers", "sessions"];

function renderHeadline(){
  const cur = selectedRows(), prev = priorRows();
  const host = $("headline"); host.innerHTML = "";
  for (const key of HEADLINE){
    const m = METRICS[key];
    const na = unavailable(key);
    const basis = m.kind === "level" ? hasBasis(cur, key) : cur.length > 0;
    const c = basis ? totalMetric(cur, key) : null;
    const p = (m.kind === "level" ? hasBasis(prev, key) : prev.length > 0)
      ? totalMetric(prev, key) : null;
    const el = document.createElement("div");
    el.className = "hcard";
    el.innerHTML =
      `<div class="label">${m.short ?? m.label}</div>
       <div class="value">${na ? na.value : fmtVal(c, key)}</div>
       <div class="delta">${na ? na.note : c == null ? "&nbsp;" : deltaHTML(c, p, key)}</div>`;
    host.appendChild(el);
  }
}

/* Coverage differs per source — Buffer has 190 days of posts, GA4 stops in
   March, the newsletter sent 5 times, followers started today. "Last 30
   days" therefore means something different in each section, and an
   executive comparing them deserves to be told so. */
function renderCoverage(){
  const rows = selectedRows();
  const days = (test) => rows.filter(test).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const parts = [
    ["Social", plural(days(r => (r.posts ?? 0) > 0), "day with posts", "days with posts")],
    ["Website", plural(days(r => (r.sessions ?? 0) > 0), "day with sessions", "days with sessions")],
    ["Newsletter", plural(days(r => (r.emails_delivered ?? 0) > 0), "send", "sends")],
    ["Followers", plural(days(r => LEVELS.some(f => f.startsWith("followers") && r[f] != null)),
      "day recorded", "days recorded")],
  ];
  $("coverage").innerHTML = "Data coverage in this range — " +
    parts.map(([n,v]) => `${n}: <b>${v}</b>`).join(" · ") +
    ` · out of ${plural(rows.length, "day", "days")} selected.`;
}

/* The cross-channel comparison. Deliberately ignores the channel filter:
   this is the view you read to decide where the effort should go. */
const CHANNELS = ["instagram", "linkedin", "facebook", "bluesky"];
const CH_LABEL = {instagram:"Instagram", linkedin:"LinkedIn", facebook:"Facebook", bluesky:"Bluesky"};
const CH_FOLLOWER = CHANNEL_FOLLOWERS;

function renderChannelTable(){
  const rows = RAW.filter(r => r.date >= $("from").value && r.date <= $("to").value);
  const sum = (ch, f) => rows.reduce((a,r) => a + (r.by_channel?.[ch]?.[f] ?? 0), 0);
  const cell = (v, ok=true) => ok ? fmtInt(v) : `<span class="dim">—</span>`;

  const body = CHANNELS.map(ch => {
    const posts = sum(ch,"posts");
    const views = sum(ch,"views");
    const reach = sum(ch,"reach");
    const eng = sum(ch,"reactions") + sum(ch,"comments") + sum(ch,"shares");
    const per = posts ? eng/posts : null;
    const ff = CH_FOLLOWER[ch];
    const fol = ff ? lastLevel(rows, ff) : null;
    return {ch, posts, views, reach, eng, per, fol};
  }).sort((a,b) => (b.per ?? -1) - (a.per ?? -1));

  const tot = body.reduce((a,r) => ({
    posts:a.posts+r.posts, views:a.views+r.views, reach:a.reach+r.reach, eng:a.eng+r.eng,
    fol:(r.fol==null? a.fol : (a.fol ?? 0) + r.fol),
  }), {posts:0,views:0,reach:0,eng:0,fol:null});

  $("channelTable").innerHTML = `
    <div class="tablewrap"><table>
      <thead><tr>
        <th scope="col">Channel</th><th scope="col">Posts</th><th scope="col">Views</th>
        <th scope="col">Reach&nbsp;†</th><th scope="col">Engagements</th>
        <th scope="col">Per post</th><th scope="col">Followers</th>
      </tr></thead>
      <tbody>${body.map(r => `<tr>
        <td>${CH_LABEL[r.ch]}</td>
        <td>${cell(r.posts)}</td>
        <td>${cell(r.views, r.views > 0)}</td>
        <td>${cell(r.reach, r.reach > 0)}</td>
        <td>${cell(r.eng)}</td>
        <td>${r.per == null ? '<span class="dim">—</span>' : fmtNum2(r.per)}</td>
        <td>${r.fol == null ? '<span class="dim">—</span>' : fmtInt(r.fol)}</td>
      </tr>`).join("")}</tbody>
      <tfoot><tr>
        <td>All channels</td><td>${fmtInt(tot.posts)}</td><td>${fmtInt(tot.views)}</td>
        <td>${fmtInt(tot.reach)}</td><td>${fmtInt(tot.eng)}</td>
        <td>${tot.posts ? fmtNum2(tot.eng/tot.posts) : "—"}</td>
        <td>${tot.fol == null ? "—" : fmtInt(tot.fol)}</td>
      </tr></tfoot>
    </table></div>
    <p class="tnote">Sorted by engagements per post — the only engagement measure every channel supports.
      A dash means the network does not report that metric at all, which is not the same as zero.
      † Reach is the sum of per-post reach, so the same person counts once per post seen; it is not an audience size.</p>`;
}

/* Warnings attached to a source, e.g. the analytics blackout. */
function renderFlags(){
  const web = $("note-web"), email = $("note-email");
  web.innerHTML = ""; email.innerHTML = "";

  if (WEB_GAP){
    const ann = ANNOTATIONS.filter(a => a.scope === "web").map(a => a.detail).join(" ");
    web.innerHTML = `<div class="flag"><b>No analytics data recorded since ${WEB_GAP}.</b>
      ${ann || "Zeros after this date are missing measurement, not lost traffic."}</div>`;
  }

  const sends = selectedRows().filter(r => (r.emails_delivered ?? 0) > 0);
  const lastSend = sends.at(-1)?.date;
  email.innerHTML = `<div class="flag softflag">${
    sends.length === 0
      ? "<b>No sends in this range.</b> Open rate and click-through need a send to measure; widen the range to see campaign performance."
      : `<b>${sends.length} send${sends.length===1?"":"s"} in this range</b>, most recently ${lastSend}. Rates below are pooled across those sends, not averaged.`
  }</div>`;
}

/* Every methodology note in one place, so the cards stay readable. */
function renderMethod(){
  const seen = new Set();
  const items = Object.entries(METRICS).filter(([k,m]) => m.note && !seen.has(k) && seen.add(k));
  $("methodBody").innerHTML = `<dl>${items.map(([k,m]) =>
    `<dt>${m.label}</dt><dd>${m.note}</dd>`).join("")}
    <dt>Rates are never stored</dt><dd>data.json holds raw counts only. Every
    percentage here is computed from summed counts at the moment you read it,
    because averaging daily rates gives the wrong answer — the correct weekly
    open rate is total opens ÷ total delivered, not the mean of seven daily
    rates.</dd>
    <dt>Comparison periods</dt><dd>Each card compares against the immediately
    preceding period of equal length. Counts show percentage change; rates show
    percentage-point change, since the difference between two percentages is
    not itself a percentage.</dd></dl>`;
}
function renderChips(){
  const el = $("chips"); el.innerHTML = "";
  for (const [key,m] of Object.entries(METRICS)){
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = m.label;
    b.setAttribute("aria-pressed", key === metric);
    b.onclick = () => { metric = key; renderChips(); renderChart(); };
    el.appendChild(b);
  }
}
function renderChart(){
  const rows = selectedRows(), host = $("chart");
  const buckets = aggregate(rows);
  $("chartNotes").innerHTML = "";
  if (!buckets.length){ host.innerHTML = `<div class="empty">No data in this range. Widen the dates.</div>`; return; }
  const m = METRICS[metric];
  const vals = buckets.map(b => readMetric(b, metric));
  const shown = vals.filter(v => v != null);
  if (!shown.length){
    host.innerHTML = `<div class="empty">${m.zero || "No " + m.label.toLowerCase() + " recorded in this range."}</div>`;
    return;
  }
  const asBars = (m.kind === "sum" || m.kind === "stock");

  const W = 900, H = 320, L = 56, R = 12, T = 14, B = 34;
  const iw = W-L-R, ih = H-T-B;
  let max = Math.max(...shown, 0), min = Math.min(...shown, 0);
  if (m.kind === "level" || m.kind === "ratio"){ const pad = (max-min)*0.15 || max*0.1 || 1; min -= pad; max += pad; }
  else { max = max * 1.08 || 1; }
  if (max === min) max = min + 1;
  const y = v => T + ih - ((v-min)/(max-min))*ih;
  const n = buckets.length;
  const bw = iw/n, cx = i => L + bw*i + bw/2;

  const ticks = 4, grid = [];
  for (let i=0;i<=ticks;i++){
    const v = min + (max-min)*i/ticks, yy = y(v);
    grid.push(`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>
      <text class="axis" x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end">${
        m.fmt==="pct" ? (v*100).toFixed(1)+"%" : shortNum(v)}</text>`);
  }
  const step = Math.ceil(n/12), xlabels = buckets.map((b,i)=>
    i % step ? "" : `<text class="axis" x="${cx(i).toFixed(1)}" y="${H-12}" text-anchor="middle">${bucketLabel(b.key)}</text>`).join("");

  let series = "";
  if (asBars){
    series = buckets.map((b,i)=>{
      const v = vals[i]; if (v==null) return "";
      const top = Math.min(y(v), y(0)), h = Math.abs(y(v)-y(0));
      return `<rect class="bar" x="${(cx(i)-bw*0.32).toFixed(1)}" y="${top.toFixed(1)}" width="${(bw*0.64).toFixed(1)}"
        height="${Math.max(h,1).toFixed(1)}" rx="2" fill="var(${m.color})" opacity=".85">
        <title>${bucketLabel(b.key)} · ${fmtVal(v,metric)}</title></rect>`;
    }).join("");
  } else {
    // Break the line at gaps instead of interpolating across them — a
    // straight run between two known points would invent readings that
    // were never taken.
    let d = "", pen = false;
    buckets.forEach((b,i) => {
      if (vals[i] == null){ pen = false; return; }
      d += `${pen ? "L" : "M"}${cx(i).toFixed(1)} ${y(vals[i]).toFixed(1)} `;
      pen = true;
    });
    series = `<path d="${d.trim()}" fill="none" stroke="var(${m.color})" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>` +
      buckets.map((b,i)=> vals[i]==null ? "" :
        `<circle class="pt" cx="${cx(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="${n>60?1.6:3}"
          fill="var(${m.color})"><title>${bucketLabel(b.key)} · ${fmtVal(vals[i],metric)}</title></circle>`).join("");
  }

  /* Event markers. Without them the March cliff in web traffic looks like a
     collapse; with them it reads as the tag going missing, which is what
     actually happened. */
  const marks = [], notes = [];
  for (const a of ANNOTATIONS){
    const k = bucketKey(a.date);
    const i = buckets.findIndex(b => b.key === k);
    if (i < 0) continue;
    const x = cx(i).toFixed(1);
    marks.push(`<line class="ann" x1="${x}" x2="${x}" y1="${T}" y2="${T+ih}"/>
      <text class="annlabel" x="${x}" y="${T-3}" text-anchor="middle">${notes.length+1}</text>`);
    notes.push(`<b>${notes.length+1}</b> ${a.date} — ${a.label}`);
  }
  $("chartNotes").innerHTML = notes.join(" &nbsp;·&nbsp; ");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${m.label} by ${grain}">${grid.join("")}${series}${marks.join("")}${xlabels}</svg>`;
}
function shortNum(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(1)+"M";
  if (a >= 1e3) return (v/1e3).toFixed(1)+"k";
  return Math.round(v).toLocaleString();
}
function renderAll(){
  $("rangeLabel").textContent = `${$("from").value} → ${$("to").value} · ${
    {day:"daily",week:"weekly",month:"monthly",year:"yearly"}[grain]}` +
    (channel === "all" ? "" : ` · social filtered to ${channel}`);
  renderHeadline(); renderCoverage(); renderCards();
  renderChannelTable(); renderFlags(); renderChart();
}

/* ---------- controls ---------- */
$("grainSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  grain = b.dataset.grain;
  [...$("grainSeg").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  renderAll();
});
$("presetSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  [...$("presetSeg").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  const last = ROWS[ROWS.length-1].date;
  if (b.dataset.preset === "all"){ $("from").value = ROWS[0].date; }
  else {
    const start = shift(last, -(+b.dataset.preset - 1));
    $("from").value = start < ROWS[0].date ? ROWS[0].date : start;
  }
  $("to").value = last;
  renderAll();
});
["from","to"].forEach(id => $(id).addEventListener("change", () => {
  [...$("presetSeg").children].forEach(x => x.setAttribute("aria-pressed","false"));
  renderAll();
}));
$("channelSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  channel = b.dataset.channel;
  [...$("channelSeg").children].forEach(x => x.setAttribute("aria-pressed", x===b));
  project();
  renderAll();
});
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  $("themeBtn").textContent = dark ? "Dark" : "Light";
  renderChart();
});

/* ---------- boot ---------- */
function showMessage(title, body){
  document.querySelector(".controls").hidden = true;
  for (const id of ["cards-social","cards-web","cards-email"]) $(id).closest(".group").hidden = true;
  document.querySelector(".chartbox").innerHTML =
    `<div class="banner"><b>${title}</b>${body}</div>`;
  $("foot").textContent = "";
}

(async function init(){
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
  $("themeBtn").textContent = prefersDark ? "Light" : "Dark";

  let live = null, failed = null;
  try {
    const r = await fetch("./data.json", {cache:"no-store"});
    if (r.ok) live = await r.json(); else failed = `The server returned ${r.status}.`;
  } catch (e){ failed = "The file could not be loaded."; }

  if (!Array.isArray(live) || !live.length){
    showMessage("No data yet",
      `<code>data.json</code> is missing, empty, or not an array. ${failed || ""}
       The nightly job writes it — check the Actions tab for a failed run, or trigger
       <em>Refresh dashboard data</em> manually.`);
    return;
  }

  RAW = live.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  KEY_EVENTS = RAW.some(r => (r.conversions ?? 0) > 0);

  /* An ongoing blackout, not merely a quiet week: the last day with any
     sessions, if that was more than a week before the end of the data. */
  const lastWeb = [...RAW].reverse().find(r => (r.sessions ?? 0) > 0)?.date;
  WEB_GAP = (lastWeb && (parse(RAW.at(-1).date) - parse(lastWeb)) / 864e5 > 7)
    ? shift(lastWeb, 1) : null;

  /* Optional. A missing annotations.json just means no event markers. */
  try {
    const r = await fetch("./annotations.json", {cache:"no-store"});
    if (r.ok){
      const a = await r.json();
      if (Array.isArray(a)) ANNOTATIONS = a.filter(x => x && x.date).sort((x,y)=> x.date < y.date ? -1 : 1);
    }
  } catch (e){}

  project();
  const last = ROWS[ROWS.length-1].date;

  $("from").min = $("to").min = ROWS[0].date;
  $("from").max = $("to").max = last;
  /* Default to the last quarter, not the last year. A 90-day window has a
     prior period the data actually covers, so the change figures mean
     something on first load — and a quarter is the period an executive team
     reviews anyway. */
  $("to").value = last;
  const start = shift(last, -89);
  $("from").value = start < ROWS[0].date ? ROWS[0].date : start;
  for (const b of $("presetSeg").children)
    b.setAttribute("aria-pressed", b.dataset.preset === "90");

  // Flag stale data rather than presenting it as current. The job drifts by
  // design, so allow two days before saying anything.
  const behind = Math.round((Date.now() - parse(last)) / 864e5);
  $("foot").innerHTML = `${ROWS.length.toLocaleString()} days · ${ROWS[0].date} to ${last}` +
    (behind > 2 ? ` · <span class="stale">last refresh was ${behind} days ago</span>` : "");

  renderChips(); renderMethod(); renderAll();
})();
</script>
